---
layout: default
---
<article>
  <header class="post-header">
    <div class="post-meta">
      <span class="post-tag">{{ page.category }}</span>
      <span class="post-date">{{ page.date | date: "%B %d, %Y" }}</span>
    </div>
    <h1>{{ page.title }}</h1>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <nav class="post-nav">
    <a href="{{ '/journal/' | relative_url }}">&larr; Back to Journal</a>
  </nav>
</article>
