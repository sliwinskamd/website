<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <nav class="nav">
    <a href="{{ '/' | relative_url }}" class="nav-logo">Dr. A Sliwinska, MD</a>
    <div class="nav-links">
      <a href="{{ '/#about' | relative_url }}">Philosophy</a>
      <a href="{{ '/journal/' | relative_url }}">Journal</a>
      <a href="{{ '/#newsletter' | relative_url }}">Newsletter</a>
      <a href="{{ '/#contact' | relative_url }}">Contact</a>
    </div>
  </nav>

  {{ content }}

  <footer class="footer">
    <div class="footer-top">
      <span>&copy; {{ 'now' | date: "%Y" }} Dr. A Sliwinska, MD</span>
      <span class="footer-divider">&middot;</span>
      <span>For business enquiries — <a href="mailto:example@gmail.com">example@gmail.com</a></span>
    </div>
    <div class="footer-bottom">
      <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
    </div>
  </footer>

  <script>
    // Scroll reveal
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // Navbar scroll
    window.addEventListener('scroll', () => {
      document.querySelector('.nav').classList.toggle('scrolled', window.scrollY > 60);
    });
  </script>
</body>
</html>
